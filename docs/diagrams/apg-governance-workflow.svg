<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img" aria-labelledby="title description">
  <title id="title">APG from one idea to a usable project</title>
  <desc id="description">A bilingual workflow showing how APG turns a user's natural-language idea into product planning, professional design, architecture, agent execution, testing, and a usable project.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#455A64"/></marker><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#1D3557}.title{font-size:27px;font-weight:700}.lane{font-size:15px;font-weight:700}.label{font-size:15px;font-weight:700}.small{font-size:13px}.box{stroke-width:2}.arrow{fill:none;stroke:#455A64;stroke-width:2.4;marker-end:url(#arrow)}.dash{stroke-dasharray:7 5}</style></defs>
  <rect width="1800" height="1050" fill="#fff"/>
  <text x="900" y="46" text-anchor="middle" class="title">APG: From One Idea to a Usable Project / 从一句想法，到一个能用的项目</text>
  <g class="box"><rect x="40" y="90" width="1720" height="150" rx="8" fill="#F7FBFF" stroke="#457B9D"/><rect x="40" y="270" width="1720" height="250" rx="8" fill="#FFFCF5" stroke="#D79B00"/><rect x="40" y="550" width="1720" height="190" rx="8" fill="#F9F7FC" stroke="#9673A6"/><rect x="40" y="770" width="1720" height="140" rx="8" fill="#F4FBF4" stroke="#82B366"/><rect x="160" y="945" width="1480" height="65" fill="#F5F5F5" stroke="#666" stroke-dasharray="7 5"/></g>
  <text x="60" y="120" class="lane">USER / 用户</text><text x="60" y="300" class="lane">APG PROJECT ENGINE / APG 项目引擎</text><text x="60" y="580" class="lane">SPECIALIZED AGENTS / 专业代理协作</text><text x="60" y="800" class="lane">RESULT / 结果</text>
  <g class="box"><rect x="80" y="145" width="240" height="70" rx="10" fill="#DAE8FC" stroke="#457B9D"/><rect x="600" y="145" width="260" height="70" rx="10" fill="#DAE8FC" stroke="#457B9D"/><rect x="1460" y="145" width="250" height="70" rx="10" fill="#D5E8D4" stroke="#82B366"/>
  <rect x="80" y="345" width="220" height="80" rx="10" fill="#FFF2CC" stroke="#D6B656"/><rect x="350" y="345" width="220" height="80" rx="10" fill="#FFE6CC" stroke="#D79B00"/><rect x="620" y="345" width="220" height="80" rx="10" fill="#E1D5E7" stroke="#9673A6"/><rect x="890" y="345" width="220" height="80" rx="10" fill="#DAE8FC" stroke="#457B9D"/><rect x="1160" y="345" width="220" height="80" rx="10" fill="#FFF2CC" stroke="#D6B656"/><rect x="1430" y="345" width="250" height="80" rx="10" fill="#FFE6CC" stroke="#D79B00"/>
  <rect x="100" y="615" width="220" height="70" rx="10" fill="#E1D5E7" stroke="#9673A6"/><rect x="410" y="615" width="220" height="70" rx="10" fill="#E1D5E7" stroke="#9673A6"/><rect x="720" y="615" width="220" height="70" rx="10" fill="#DAE8FC" stroke="#457B9D"/><rect x="1030" y="615" width="220" height="70" rx="10" fill="#F8CECC" stroke="#B85450"/><rect x="1340" y="615" width="300" height="70" rx="10" fill="#D5E8D4" stroke="#82B366"/>
  <rect x="200" y="825" width="250" height="60" rx="10" fill="#D5E8D4" stroke="#82B366"/><rect x="775" y="825" width="250" height="60" rx="10" fill="#D5E8D4" stroke="#82B366"/><rect x="1350" y="825" width="250" height="60" rx="10" fill="#D5E8D4" stroke="#82B366"/></g>
  <g text-anchor="middle"><text x="200" y="172" class="label">Say what you want</text><text x="200" y="197" class="small">用自然语言说出想法</text><text x="730" y="172" class="label">Answer only necessary questions</text><text x="730" y="197" class="small">只回答少量必要问题</text><text x="1585" y="172" class="label">Review the result</text><text x="1585" y="197" class="small">查看并确认最终结果</text>
  <text x="190" y="375" class="label">Understand goal</text><text x="190" y="400" class="small">理解用户、场景与目标</text><text x="460" y="375" class="label">Product plan</text><text x="460" y="400" class="small">功能范围与成功标准</text><text x="730" y="375" class="label">Experience design</text><text x="730" y="400" class="small">用户流程、页面与状态</text><text x="1000" y="375" class="label">Architecture &amp; stack</text><text x="1000" y="400" class="small">架构、数据与技术选型</text><text x="1270" y="375" class="label">Execution plan</text><text x="1270" y="400" class="small">阶段、依赖、任务与验收</text><text x="1555" y="375" class="label">Agent orchestration</text><text x="1555" y="400" class="small">选择角色并编排协作</text>
  <text x="210" y="643" class="label">Research &amp; Product</text><text x="210" y="668" class="small">研究 / 产品</text><text x="520" y="643" class="label">Design &amp; Architecture</text><text x="520" y="668" class="small">设计 / 架构</text><text x="830" y="643" class="label">Frontend &amp; Backend</text><text x="830" y="668" class="small">前端 / 后端开发</text><text x="1140" y="643" class="label">Integration &amp; Testing</text><text x="1140" y="668" class="small">集成 / 测试 / 审查</text><text x="1490" y="643" class="label">Build &amp; Delivery</text><text x="1490" y="668" class="small">构建 / 文档 / 交付</text>
  <text x="325" y="850" class="label">Runnable project</text><text x="325" y="873" class="small">可运行项目</text><text x="900" y="850" class="label">Acceptance result</text><text x="900" y="873" class="small">测试与验收结果</text><text x="1475" y="850" class="label">Ready for iteration</text><text x="1475" y="873" class="small">可继续修改和迭代</text></g>
  <g class="arrow"><path d="M320 180H600" class="dash"/><path d="M200 215V345"/><path d="M300 385H350"/><path d="M570 385H620"/><path d="M840 385H890"/><path d="M1110 385H1160"/><path d="M1380 385H1430"/><path d="M1555 425V550H830V615"/><path d="M320 650H410"/><path d="M630 650H720"/><path d="M940 650H1030"/><path d="M1250 650H1340"/><path d="M1490 685V760H900V825"/><path d="M450 855H775"/><path d="M1025 855H1350"/><path d="M1600 855H1720V180H1710"/></g>
  <text x="455" y="168" class="small" text-anchor="middle">only when needed / 只在必要时</text><text x="900" y="974" class="label" text-anchor="middle">INVISIBLE ENGINEERING GUARDRAILS / 用户无需管理的工程保障</text><text x="900" y="998" class="small" text-anchor="middle">preserve existing work · bounded changes · quality gates · recovery · history / 保留已有工作 · 控制范围 · 质量检查 · 可恢复 · 可接续</text>
</svg>
