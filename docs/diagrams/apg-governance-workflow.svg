<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title description">
  <title id="title">APG governance workflow</title>
  <desc id="description">Bilingual engineering workflow for Adaptive Project Governance, including independent external delivery boundaries.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#455A64"/></marker><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#1D3557}.title{font-weight:700;font-size:26px}.label{font-size:15px;font-weight:700}.small{font-size:13px}.box{stroke-width:2}.arrow{fill:none;stroke:#455A64;stroke-width:2.5;marker-end:url(#arrow)}.dash{stroke-dasharray:7 5}</style></defs>
  <rect width="1600" height="960" fill="#ffffff"/>
  <text x="800" y="45" text-anchor="middle" class="title">APG Governance Workflow / APG 治理工作流</text>
  <g class="box"><rect x="60" y="110" width="230" height="85" rx="10" fill="#DAE8FC" stroke="#457B9D"/><rect x="365" y="105" width="215" height="105" rx="55" fill="#FFF2CC" stroke="#D6B656"/><rect x="670" y="110" width="250" height="85" rx="10" fill="#E1D5E7" stroke="#9673A6"/><rect x="1010" y="110" width="250" height="85" rx="10" fill="#DAE8FC" stroke="#457B9D"/>
  <rect x="1010" y="280" width="250" height="120" rx="60" fill="#FFF2CC" stroke="#D6B656"/><rect x="670" y="300" width="250" height="85" rx="10" fill="#E1D5E7" stroke="#9673A6"/><rect x="365" y="300" width="230" height="85" rx="10" fill="#FFE6CC" stroke="#D79B00"/><rect x="60" y="300" width="230" height="85" rx="10" fill="#DAE8FC" stroke="#457B9D"/>
  <rect x="60" y="490" width="230" height="85" rx="10" fill="#F8CECC" stroke="#B85450"/><rect x="365" y="485" width="230" height="105" rx="55" fill="#FFF2CC" stroke="#D6B656"/><rect x="670" y="490" width="250" height="85" rx="10" fill="#D5E8D4" stroke="#82B366"/><rect x="365" y="670" width="230" height="85" rx="10" fill="#F8CECC" stroke="#B85450"/>
  <rect x="990" y="470" width="500" height="330" rx="8" fill="#F5F5F5" stroke="#666"/><rect x="1015" y="530" width="205" height="65" rx="10" fill="#D5E8D4" stroke="#82B366"/><rect x="1260" y="530" width="205" height="65" rx="10" fill="#DAE8FC" stroke="#457B9D"/><rect x="1015" y="650" width="205" height="65" rx="10" fill="#FFE6CC" stroke="#D79B00"/><rect x="1260" y="650" width="205" height="65" rx="10" fill="#E1D5E7" stroke="#9673A6"/><rect x="1140" y="740" width="205" height="40" rx="10" fill="#FFF2CC" stroke="#D6B656"/></g>
  <g text-anchor="middle"><text x="175" y="142" class="label">1. Inspect facts</text><text x="175" y="166" class="small">确认项目根、规则、Git 与证据</text><text x="472" y="145" class="label">2. Doctor</text><text x="472" y="170" class="small">治理状态是否自洽？</text><text x="795" y="142" class="label">3. Audit / Adopt preview</text><text x="795" y="166" class="small">未接入：只读审计与接入预览</text><text x="1135" y="142" class="label">4. Bound change</text><text x="1135" y="166" class="small">路径、验收、非目标、回滚</text>
  <text x="1135" y="328" class="label">High risk / structural?</text><text x="1135" y="353" class="small">高风险或结构性变更？</text><text x="795" y="332" class="label">plan-change preview</text><text x="795" y="356" class="small">影响分析与审批范围</text><text x="480" y="332" class="label">Owner authorization</text><text x="480" y="356" class="small">项目根与精确路径授权</text><text x="175" y="332" class="label">Implement bounded change</text><text x="175" y="356" class="small">仅修改获批路径</text>
  <text x="175" y="522" class="label">Run affected Gates</text><text x="175" y="546" class="small">fast / full；首个失败即停止</text><text x="480" y="525" class="label">Pass?</text><text x="480" y="550" class="small">验证是否通过？</text><text x="795" y="522" class="label">Receipt + post-state</text><text x="795" y="546" class="small">收据、哈希与交付证据</text><text x="480" y="702" class="label">Rollback on exact post-state</text><text x="480" y="726" class="small">验证后置状态后最小范围恢复</text>
  <text x="1240" y="505" class="label">External delivery boundaries / 外部交付边界</text><text x="1118" y="557" class="label">Public publication</text><text x="1118" y="580" class="small">公开发布</text><text x="1362" y="557" class="label">Global promotion</text><text x="1362" y="580" class="small">全局推广</text><text x="1118" y="677" class="label">Host / runtime</text><text x="1118" y="700" class="small">宿主/运行时激活</text><text x="1362" y="677" class="label">Provider / network</text><text x="1362" y="700" class="small">Provider/网络验证</text><text x="1242" y="766" class="label">Downstream pilot / 下游试点</text></g>
  <g class="arrow"><path d="M290 152H365"/><path d="M580 152H670"/><path d="M920 152H1010"/><path d="M1135 195V280"/><path d="M1010 340H920"/><path d="M670 342H595"/><path d="M365 342H290"/><path d="M175 385V490"/><path d="M290 532H365"/><path d="M595 532H670"/><path d="M480 590V670"/><path d="M920 532H990"/><path d="M1220 562H1260"/><path d="M1118 595V650"/><path d="M1362 595V650"/><path d="M1362 715V740"/></g>
  <path d="M1010 370 C800 450 400 430 175 300" class="arrow dash"/><text x="660" y="420" class="small">低风险：直接受限实施 / low risk: direct bounded work</text><text x="615" y="522" class="small" fill="#2E7D32">yes</text><text x="500" y="640" class="small" fill="#B85450">no</text><text x="945" y="515" class="small">独立授权 / separate authorization</text>
  <text x="800" y="900" text-anchor="middle" class="small">Each external boundary requires its own authorization, execution evidence, and rollback record. No stage implies another.</text><text x="800" y="925" text-anchor="middle" class="small">每个外部边界都需要独立授权、执行证据和回滚记录；任何阶段均不能推断另一阶段已完成。</text>
</svg>
